<svg xmlns="http://www.w3.org/2000/svg" width="304" height="200" viewBox="0 0 304 200" shape-rendering="crispEdges" role="img" aria-label="vidbridge demo: a pixel film projector with two spinning reels and a flickering yellow beam">
<style>
  :root { --reel: #7d8590; --hole: #ffffff; --body: #4b5563; --dark: #1f2328; --glass: #3b8fd9; --beam: #c99a00; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --reel: #c9d1d9; --hole: #0d1117; --body: #7d8796; --dark: #2d333b; --glass: #8ecbff; --beam: #ffe600; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-reel { fill: var(--reel); } .c-hole { fill: var(--hole); } .c-body { fill: var(--body); } .c-dark { fill: var(--dark); } .c-glass { fill: var(--glass); } .c-beam { fill: var(--beam); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-reel1 { transform-box: fill-box; transform-origin: center; animation: m-reel1 4s linear infinite; }
  @keyframes m-reel1 { to { transform: rotate(360deg); } }
  .g-reel2 { transform-box: fill-box; transform-origin: center; animation: m-reel2 4s linear infinite; }
  @keyframes m-reel2 { to { transform: rotate(360deg); } }
  .g-beam { transform-box: fill-box; transform-origin: 0% 50%; animation: m-beam 1.3s steps(2, end) infinite; }
  @keyframes m-beam { 0%, 100% { opacity: 1; } 40% { opacity: .45; } 70% { opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-reel1, .g-reel2, .g-beam { animation: none; } }
</style>
