<svg xmlns="http://www.w3.org/2000/svg" width="296" height="224" viewBox="0 0 296 224" shape-rendering="crispEdges" role="img" aria-label="Offerprofi: a pixel chef with a big toque, serving a copper cloche whose lid lifts as steam rises">
<style>
  :root { --toque: #ffffff; --line: #6e7781; --skin: #e7ae80; --eye: #1f2328; --stache: #5c3317; --cheek: #e06a5a; --scarf: #cf222e; --coat: #d0d7de; --apron: #424a53; --shoe: #24292f; --copper: #c45a1f; --shine: #ffb787; --rim: #8f4413; --knob: #8f4413; --tray: #8c959f; --steam: #8c959f; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --toque: #f6f8fa; --line: #8b949e; --skin: #f2c29b; --eye: #0d1117; --stache: #8a5a2b; --cheek: #f08a7a; --scarf: #e5534b; --coat: #e6edf3; --apron: #6e7781; --shoe: #57606a; --copper: #f0965c; --shine: #ffd2b0; --rim: #b5622c; --knob: #b5622c; --tray: #c9d1d9; --steam: #c9d1d9; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-toque { fill: var(--toque); } .c-line { fill: var(--line); } .c-skin { fill: var(--skin); } .c-eye { fill: var(--eye); } .c-stache { fill: var(--stache); } .c-cheek { fill: var(--cheek); } .c-scarf { fill: var(--scarf); } .c-coat { fill: var(--coat); } .c-apron { fill: var(--apron); } .c-shoe { fill: var(--shoe); } .c-copper { fill: var(--copper); } .c-shine { fill: var(--shine); } .c-rim { fill: var(--rim); } .c-knob { fill: var(--knob); } .c-tray { fill: var(--tray); } .c-steam { fill: var(--steam); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-lid { transform-box: fill-box; transform-origin: 100% 100%; animation: m-lid 3.2s ease-in-out infinite; }
  @keyframes m-lid { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  .g-steam { transform-box: fill-box; transform-origin: center; animation: m-steam 1.3s steps(2, end) infinite; }
  @keyframes m-steam { 0%, 100% { opacity: 1; } 40% { opacity: .45; } 70% { opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-lid, .g-steam { animation: none; } }
</style>
