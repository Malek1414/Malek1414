<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" shape-rendering="crispEdges" role="img" aria-label="ORACLE: a pixel seer, a single eye inside a glowing crystal ball on a gold stand, blinking while a vision flickers around it">
<style>
  :root { --orb: #8250df; --rim: #4c2889; --mist: #c8a6ff; --white: #ffffff; --gold: #c98a00; --ink: #1f2328; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --orb: #a371f7; --rim: #6e40c9; --mist: #e2d1ff; --white: #f6f0ff; --gold: #ffc24a; --ink: #0d1117; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-orb { fill: var(--orb); } .c-rim { fill: var(--rim); } .c-mist { fill: var(--mist); } .c-white { fill: var(--white); } .c-gold { fill: var(--gold); } .c-ink { fill: var(--ink); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-ball { transform-box: fill-box; transform-origin: center; animation: m-ball 2.4s ease-in-out infinite; }
  @keyframes m-ball { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  .g-eye { transform-box: fill-box; transform-origin: center; animation: m-eye 4.2s ease-in-out infinite; }
  @keyframes m-eye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .g-vision { transform-box: fill-box; transform-origin: center; animation: m-vision 1.3s steps(2, end) infinite; }
  @keyframes m-vision { 0%, 100% { opacity: 1; } 40% { opacity: .45; } 70% { opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-ball, .g-eye, .g-vision { animation: none; } }
</style>
