<svg xmlns="http://www.w3.org/2000/svg" width="304" height="256" viewBox="0 0 304 256" shape-rendering="crispEdges" role="img" aria-label="malek1414.github.io: a smiling pixel basketball dribbling under a hoop with an M on the backboard">
<style>
  :root { --hot: #e0480b; --ball: #b85614; --edge: #57606a; --board: #f6f8fa; --net: #8c959f; --ink: #1f2328; --seam: #6e2c06; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --hot: #ff6a2b; --ball: #e07b2e; --edge: #c9d1d9; --board: #21262d; --net: #f0f3f6; --ink: #0d1117; --seam: #8a3d0f; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-hot { fill: var(--hot); } .c-ball { fill: var(--ball); } .c-edge { fill: var(--edge); } .c-board { fill: var(--board); } .c-net { fill: var(--net); } .c-ink { fill: var(--ink); } .c-seam { fill: var(--seam); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-ball { transform-box: fill-box; transform-origin: center; animation: m-ball .9s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes m-ball { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(24px); } }
  .g-net { transform-box: fill-box; transform-origin: 50% 0%; animation: m-net 2.6s ease-in-out infinite; }
  @keyframes m-net { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-ball, .g-net { animation: none; } }
</style>
