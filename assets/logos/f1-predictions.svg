<svg xmlns="http://www.w3.org/2000/svg" width="320" height="208" viewBox="0 0 320 208" shape-rendering="crispEdges" role="img" aria-label="F1 Predictions: a pixel Formula 1 car with spinning wheels and a nodding driver">
<style>
  :root { --red: #d0261b; --white: #d0d7de; --grey: #30363d; --ink: #0d1117; --yellow: #e3a008; --lines: #8c959f; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --red: #ff4b3e; --white: #f0f3f6; --grey: #5b6370; --ink: #0d1117; --yellow: #ffd23f; --lines: #8b949e; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-red { fill: var(--red); } .c-white { fill: var(--white); } .c-grey { fill: var(--grey); } .c-ink { fill: var(--ink); } .c-yellow { fill: var(--yellow); } .c-lines { fill: var(--lines); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-wheelR { transform-box: fill-box; transform-origin: 50% 50%; animation: m-wheelR 4s linear infinite; }
  @keyframes m-wheelR { to { transform: rotate(360deg); } }
  .g-wheelF { transform-box: fill-box; transform-origin: 50% 50%; animation: m-wheelF 4s linear infinite; }
  @keyframes m-wheelF { to { transform: rotate(360deg); } }
  .g-helmet { transform-box: fill-box; transform-origin: center; animation: m-helmet 2.4s ease-in-out 1.4s infinite; }
  @keyframes m-helmet { 0%, 54%, 66%, 78%, 100% { transform: translateY(0); } 60%, 72% { transform: translateY(8px); } }
  .g-lines { transform-box: fill-box; transform-origin: center; animation: m-lines 1.3s steps(2, end) infinite; }
  @keyframes m-lines { 0%, 100% { opacity: 1; } 40% { opacity: .45; } 70% { opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-wheelR, .g-wheelF, .g-helmet, .g-lines { animation: none; } }
</style>
