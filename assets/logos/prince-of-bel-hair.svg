<svg xmlns="http://www.w3.org/2000/svg" width="272" height="256" viewBox="0 0 272 256" shape-rendering="crispEdges" role="img" aria-label="Prince of Bel Hair: a pixel barber pole wearing a gold crown, stripes climbing while a pair of scissors snips beside it">
<style>
  :root { --gold: #b88400; --red: #d1242f; --blue: #0969da; --white: #d8dee4; --steel: #57606a; --ink: #1f2328; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --gold: #ffc93d; --red: #ff4d5e; --blue: #4f8cff; --white: #f0f3f6; --steel: #9ba5b0; --ink: #0d1117; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-gold { fill: var(--gold); } .c-red { fill: var(--red); } .c-blue { fill: var(--blue); } .c-white { fill: var(--white); } .c-steel { fill: var(--steel); } .c-ink { fill: var(--ink); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-crown { transform-box: fill-box; transform-origin: 50% 100%; animation: m-crown 2.6s ease-in-out infinite; }
  @keyframes m-crown { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .g-eyes { transform-box: fill-box; transform-origin: center; animation: m-eyes 4.2s ease-in-out infinite; }
  @keyframes m-eyes { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .g-stripes { transform-box: fill-box; transform-origin: center; animation: m-stripes 2.2s ease-in-out infinite; }
  @keyframes m-stripes { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .g-snip { transform-box: fill-box; transform-origin: 41% 100%; animation: m-snip .7s ease-in-out infinite; }
  @keyframes m-snip { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-crown, .g-eyes, .g-stripes, .g-snip { animation: none; } }
</style>
