<svg xmlns="http://www.w3.org/2000/svg" width="320" height="208" viewBox="0 0 320 208" shape-rendering="crispEdges" role="img" aria-label="Social Chrome: a pixel chameleon on a branch, its eye darting toward a fly">
<style>
  :root { --skin: #1f9a35; --crest: #0f5e22; --band: #8fae12; --belly: #6cc95a; --eye: #1f2328; --ring: #d8cfae; --bark: #6e4521; --fly: #8c959f; --flybody: #1f2328; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --skin: #5ee06a; --crest: #2a9a45; --band: #d6f25a; --belly: #b8f5b0; --eye: #0d1117; --ring: #f6efe0; --bark: #9a6534; --fly: #8b949e; --flybody: #e6edf3; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-skin { fill: var(--skin); } .c-crest { fill: var(--crest); } .c-band { fill: var(--band); } .c-belly { fill: var(--belly); } .c-eye { fill: var(--eye); } .c-ring { fill: var(--ring); } .c-bark { fill: var(--bark); } .c-fly { fill: var(--fly); } .c-flybody { fill: var(--flybody); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-tail { transform-box: fill-box; transform-origin: 100% 0%; animation: m-tail 3.2s ease-in-out infinite; }
  @keyframes m-tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  .g-pupil { transform-box: fill-box; transform-origin: center; animation: m-pupil 3s ease-in-out infinite; }
  @keyframes m-pupil { 0%, 80%, 100% { transform: translateX(0); } 84%, 92% { transform: translateX(-4px); } 88%, 96% { transform: translateX(4px); } }
  .g-fly { transform-box: fill-box; transform-origin: center; animation: m-fly 2.2s ease-in-out infinite; }
  @keyframes m-fly { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-tail, .g-pupil, .g-fly { animation: none; } }
</style>
