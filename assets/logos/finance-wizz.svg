<svg xmlns="http://www.w3.org/2000/svg" width="304" height="224" viewBox="0 0 304 224" shape-rendering="crispEdges" role="img" aria-label="Finance Wizz: a pixel piggy bank in a wizard hat waving a wand while a gold coin floats above its slot">
<style>
  :root { --pink: #e0567a; --rose: #9e2f4f; --violet: #7c3aed; --gold: #c98a00; --mint: #13a463; --ink: #1f2328; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --pink: #ff8fa3; --rose: #d65d7a; --violet: #a78bfa; --gold: #ffd166; --mint: #5fe3a1; --ink: #0d1117; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-pink { fill: var(--pink); } .c-rose { fill: var(--rose); } .c-violet { fill: var(--violet); } .c-gold { fill: var(--gold); } .c-mint { fill: var(--mint); } .c-ink { fill: var(--ink); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-coin { transform-box: fill-box; transform-origin: center; animation: m-coin 2.2s ease-in-out infinite; }
  @keyframes m-coin { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .g-wand { transform-box: fill-box; transform-origin: 0% 100%; animation: m-wand 2.6s ease-in-out infinite; }
  @keyframes m-wand { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .g-hat { transform-box: fill-box; transform-origin: 50% 100%; animation: m-hat 3.2s ease-in-out infinite; }
  @keyframes m-hat { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-coin, .g-wand, .g-hat { animation: none; } }
</style>
