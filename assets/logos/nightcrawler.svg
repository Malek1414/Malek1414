<svg xmlns="http://www.w3.org/2000/svg" width="304" height="248" viewBox="0 0 304 248" shape-rendering="crispEdges" role="img" aria-label="Nightcrawler: a pixel night owl under a crescent moon, sweeping a magnifying glass and blinking">
<style>
  :root { --lens: #4b47d6; --feather: #8a5530; --shade: #4f2f17; --cream: #dcbc8c; --gold: #d99a00; --eye: #1f2328; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --lens: #8f8dff; --feather: #b07a4f; --shade: #7a5235; --cream: #f3e2c3; --gold: #ffcc33; --eye: #0d1117; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-lens { fill: var(--lens); } .c-feather { fill: var(--feather); } .c-shade { fill: var(--shade); } .c-cream { fill: var(--cream); } .c-gold { fill: var(--gold); } .c-eye { fill: var(--eye); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-lens { transform-box: fill-box; transform-origin: 5% 95%; animation: m-lens 2.6s ease-in-out infinite; }
  @keyframes m-lens { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .g-eyes { transform-box: fill-box; transform-origin: center; animation: m-eyes 4.2s ease-in-out infinite; }
  @keyframes m-eyes { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .g-moon { transform-box: fill-box; transform-origin: center; animation: m-moon 2.4s ease-in-out infinite; }
  @keyframes m-moon { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-lens, .g-eyes, .g-moon { animation: none; } }
</style>
