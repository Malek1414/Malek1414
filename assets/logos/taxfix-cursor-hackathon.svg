<svg xmlns="http://www.w3.org/2000/svg" width="296" height="208" viewBox="0 0 296 208" shape-rendering="crispEdges" role="img" aria-label="Tap n' tax: a smiling pixel receipt getting a green check stamp while a payment card sends contactless waves">
<style>
  :root { --paper: #d8dee4; --line: #6e7781; --ink: #1f2328; --green: #1a7f37; --card: #0969da; --chip: #bf8700; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --paper: #f0f3f6; --line: #8c959f; --ink: #0d1117; --green: #3fd99a; --card: #4f8cff; --chip: #ffd166; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-paper { fill: var(--paper); } .c-line { fill: var(--line); } .c-ink { fill: var(--ink); } .c-green { fill: var(--green); } .c-card { fill: var(--card); } .c-chip { fill: var(--chip); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-stamp { transform-box: fill-box; transform-origin: center; animation: m-stamp 1.8s ease-in-out infinite; }
  @keyframes m-stamp { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  .g-waves { transform-box: fill-box; transform-origin: center; animation: m-waves 1.3s steps(2, end) infinite; }
  @keyframes m-waves { 0%, 100% { opacity: 1; } 40% { opacity: .45; } 70% { opacity: .85; } }
  .g-card { transform-box: fill-box; transform-origin: 50% 50%; animation: m-card 2.6s ease-in-out infinite; }
  @keyframes m-card { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-stamp, .g-waves, .g-card { animation: none; } }
</style>
