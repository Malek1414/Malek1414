<svg xmlns="http://www.w3.org/2000/svg" width="288" height="248" viewBox="0 0 288 248" shape-rendering="crispEdges" role="img" aria-label="SCIO: a pixel luna moth hovering over a small flame">
<style>
  :root { --green: #4d9a12; --plum: #7e3fae; --body: #a9c48f; --amber: #d97706; --orange: #e8590c; --coal: #495057; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --green: #b5ef7a; --plum: #b07fd6; --body: #f4fbe9; --amber: #ffb02e; --orange: #ff6b2c; --coal: #3b4048; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-green { fill: var(--green); } .c-plum { fill: var(--plum); } .c-body { fill: var(--body); } .c-amber { fill: var(--amber); } .c-orange { fill: var(--orange); } .c-coal { fill: var(--coal); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-moth { transform-box: fill-box; transform-origin: center; animation: m-moth 2.2s ease-in-out infinite; }
  @keyframes m-moth { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .g-flame { transform-box: fill-box; transform-origin: center; animation: m-flame 1.3s steps(2, end) infinite; }
  @keyframes m-flame { 0%, 100% { opacity: 1; } 40% { opacity: .45; } 70% { opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-moth, .g-flame { animation: none; } }
</style>
