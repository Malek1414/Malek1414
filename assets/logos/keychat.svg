<svg xmlns="http://www.w3.org/2000/svg" width="320" height="224" viewBox="0 0 320 224" shape-rendering="crispEdges" role="img" aria-label="KeyChat: a pixel bird with a key for a tail, lifting its wing while it types a chat bubble">
<style>
  :root { --key: #c98a00; --wing: #8a5a00; --eye: #1f2328; --beak: #d9480f; --bubble: #0969da; --dots: #ffffff; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --key: #ffc83d; --wing: #d9951a; --eye: #0d1117; --beak: #ff7a45; --bubble: #58a6ff; --dots: #ffffff; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-key { fill: var(--key); } .c-wing { fill: var(--wing); } .c-eye { fill: var(--eye); } .c-beak { fill: var(--beak); } .c-bubble { fill: var(--bubble); } .c-dots { fill: var(--dots); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-wing { transform-box: fill-box; transform-origin: 100% 0%; animation: m-wing .7s ease-in-out infinite; }
  @keyframes m-wing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
  .g-dots { transform-box: fill-box; transform-origin: center; animation: m-dots 1.3s steps(2, end) infinite; }
  @keyframes m-dots { 0%, 100% { opacity: 1; } 40% { opacity: .45; } 70% { opacity: .85; } }
  .g-tail { transform-box: fill-box; transform-origin: 100% 30%; animation: m-tail 2.6s ease-in-out infinite; }
  @keyframes m-tail { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-wing, .g-dots, .g-tail { animation: none; } }
</style>
