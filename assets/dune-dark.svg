<text class="h rise" x="392" y="92" font-size="56">≈ 485 Dunes <tspan font-size="26" font-weight="600" style="fill:#9198a1">written by Claude</tspan></text>
<text class="rise d1" x="394" y="134" font-size="20" style="fill:#9198a1">119 M output tokens is about 485 copies of Frank Herbert's <tspan style="fill:#ff6a2b">Dune</tspan>.</text>
<text class="rise d1" x="394" y="162" font-size="20" style="fill:#9198a1">Counting everything it read as well, 28.3 B tokens, it is about <tspan font-weight="700" style="fill:#f0f3f6">115,783 Dunes</tspan>.</text>
<text class="rise d2" x="394" y="196" font-size="13" style="fill:#9198a1">Dune ≈ 188,000 words × 1.3 tokens per word ≈ 244,400 tokens.</text>
