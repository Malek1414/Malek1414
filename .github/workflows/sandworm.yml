# Redraws the contribution graph as a sandworm eating its way through the squares.
# Output goes to the `output` branch; the README points at it.
name: sandworm

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sandworm.svg?color_snake=#c9601d&color_dots=#ebedf0,#f6dcb6,#e8b77a,#d9963f,#a8742f
            dist/sandworm-dark.svg?palette=github-dark&color_snake=#ff9a3c&color_dots=#161b22,#3b2a14,#6e4521,#b7833f,#e0aa66

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
